<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanilla patient app</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:linear-gradient(#eef2ff,#fdf4ff);color:#312e81}.phone{max-width:440px;margin:auto;min-height:100vh;padding:30px 22px}.hero{text-align:center;padding:24px 0}.avatar{width:70px;height:70px;border-radius:50%;margin:auto;background:white;display:grid;place-items:center;font-size:28px}.card{background:rgba(255,255,255,.9);border-radius:24px;padding:22px;margin:14px 0;box-shadow:0 16px 40px rgba(76,29,149,.08)}.score{font-size:54px;font-weight:850}.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#dcfce7;color:#166534}.ai{background:linear-gradient(135deg,#7c3aed,#4f46e5);color:white;border:0;border-radius:999px;padding:14px 18px;width:100%;font-weight:750}</style></head><body><div class="phone"><div class="hero"><div class="avatar">♥</div><h1>Hi, Patient!</h1><p>Your wellness is looking great today ✨</p></div><div class="card"><div>Health score</div><div class="score">86</div><span class="pill">Great</span></div><div class="card"><h3>Your latest result</h3><p>Result: 7.4%</p><p>You're doing well. Keep it up!</p></div><button class="ai">✨ Ask AI about my health</button></div></body></html>
