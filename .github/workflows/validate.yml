name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository
        run: make check
      - name: Lint example frontends (high severity fails)
        run: python scripts/clinical_ui_lint.py examples --fail-on HIGH
