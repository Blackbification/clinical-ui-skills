name: "Show us the slop"
description: "Submit a recurring AI-generated healthcare UI failure pattern using synthetic/recreated examples only."
title: "[slop] "
labels: ["clinical-slop"]
body:
  - type: markdown
    attributes:
      value: |
        **No PHI/PII or confidential product screenshots.** Recreate the pattern with synthetic content.
  - type: dropdown
    id: user
    attributes:
      label: Primary user
      options:
        - Clinician
        - Nurse
        - Pharmacist
        - Allied health professional
        - Administrative / operational staff
        - Patient
        - Carer / family
        - Mixed / other
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface
      placeholder: "e.g. inpatient worklist, patient chart, portal, results review"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What is the user trying to do?
      description: Use task verbs such as scan, compare, prioritize, enter, review, acknowledge or act.
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: What pattern does the coding agent keep generating?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it fail the task?
    validations:
      required: true
  - type: textarea
    id: appropriate
    attributes:
      label: When could this pattern actually be appropriate?
      description: Help us avoid turning anti-slop into dogma.
  - type: textarea
    id: better
    attributes:
      label: Better direction
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: "This submission contains no PHI/PII, real patient record, credential, or confidential product material."
          required: true
