name: "ClinicalUIBench eval proposal"
description: "Propose a synthetic benchmark scenario with explicit task-level assertions."
title: "[eval] "
labels: ["eval"]
body:
  - type: input
    id: title
    attributes:
      label: Scenario title
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Synthetic prompt
    validations:
      required: true
  - type: textarea
    id: assertions
    attributes:
      label: Assertions
      description: List at least five observable assertions that are not merely aesthetic preferences.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure mode this eval should expose
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data confirmation
      options:
        - label: "All scenario data is synthetic and not derived from a real patient record."
          required: true
