name: "Skill / rule proposal"
description: "Propose a new skill, rule, reference or change to existing clinical UI guidance."
title: "[proposal] "
labels: ["proposal"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repeated task or failure does the current repository not handle well?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: State the rule conditionally and concretely.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Strongest evidence tier
      options:
        - "1 — Normative accessibility / regulatory material"
        - "2 — Public human factors / usability guidance"
        - "3 — Mature healthcare design system / open clinical software"
        - "4 — Peer-reviewed research"
        - "5 — Reproducible project eval"
        - "6 — Expert heuristic / design hypothesis"
    validations:
      required: true
  - type: textarea
    id: counterexample
    attributes:
      label: Counterexample / when not to apply
      description: Where would this guidance be wrong or harmful?
    validations:
      required: true
  - type: textarea
    id: eval
    attributes:
      label: How could we evaluate it?
  - type: checkboxes
    id: privacy
    attributes:
      label: Data confirmation
      options:
        - label: "No PHI/PII or confidential clinical/product data is included."
          required: true
