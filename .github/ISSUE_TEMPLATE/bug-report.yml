name: "Bug report"
description: "Report a reproducible problem in a skill, validator, linter, eval or repository workflow."
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: bug
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, files or a synthetic example sufficient to reproduce the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Python version, coding agent/tool if relevant"
  - type: checkboxes
    id: privacy
    attributes:
      label: Data confirmation
      options:
        - label: "No PHI/PII, credentials or confidential clinical/product material is included."
          required: true
